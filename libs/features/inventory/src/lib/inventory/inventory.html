<div class="inventory-container">
  <header class="inventory-header">
    <div class="title-area">
      <h2>Inventory Overview</h2>
      <p>Manage your product stock, prices, and status.</p>
    </div>
    <ds-button variant="primary" size="md" (clicked)="addNewItem()">Add New Item</ds-button>
  </header>

  <ds-table [data]="inventoryItems()" [columns]="columns" [actionsTemplate]="actionsTpl"></ds-table>
  
  <ng-template #actionsTpl let-item>
    <ds-button variant="ghost" size="sm" (clicked)="editItem(item)">Update Qty</ds-button>
    <ds-button variant="ghost" size="sm" class="danger-text" (clicked)="deleteItem(item)">Delete</ds-button>
  </ng-template>
</div>
